services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sdd
      POSTGRES_USER: sdd_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sdd_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdd_admin -d sdd"]
      interval: 5s
      retries: 10
volumes:
  sdd_pg:
